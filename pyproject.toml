[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "puente-llm"
version = "2.0.0"
description = "Puente entre un LLM local (Ollama) y uno en la nube (Groq): una interfaz, streaming, reintentos y respaldo automático."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Darwin Montiel Mora", email = "darwinmontielm@gmail.com" }]
keywords = ["llm", "ollama", "groq", "httpx", "streaming", "ia-generativa", "cobranza", "automatizacion"]
dependencies = ["httpx>=0.27", "pydantic-settings>=2.4,<3", "typer>=0.16"]

[project.urls]
Repositorio = "https://github.com/DarwinMontiel/puente-llm"
"Registro de cambios" = "https://github.com/DarwinMontiel/puente-llm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
puente = "puente_llm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/puente_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["puente_llm"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "S", "PT"]
# E501: el largo de línea lo gestiona `ruff format`.
ignore = ["E501", "S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
