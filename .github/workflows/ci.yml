name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint · Tipos · Pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov --cov-report=term --cov-fail-under=90

  build:
    name: Paquete · instalación y CLI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pipx run build
      - name: Instalar el wheel en un entorno limpio y probar el comando
        run: |
          python -m venv /tmp/limpio
          /tmp/limpio/bin/pip install dist/*.whl
          /tmp/limpio/bin/puente --help
          /tmp/limpio/bin/python -c "import puente_llm; print(puente_llm.__version__)"
